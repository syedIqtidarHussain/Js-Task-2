<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internship Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Tabbed Navigation Menu -->
  <section class="container">
    <h2>Tabbed Navigation Menu</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="Tab1">Home</button>
      <button class="tab-btn" data-tab="Tab2">Services</button>
      <button class="tab-btn" data-tab="Tab3">About</button>
    </div>
    <div id="Tab1" class="tab-content active">
      <h3>Home Section</h3>
      <p>Welcome to the home tab content!</p>
    </div>
    <div id="Tab2" class="tab-content">
      <h3>Services Section</h3>
      <p>Welcome to the services tab content!</p>
    </div>
    <div id="Tab3" class="tab-content">
      <h3>About Section</h3>
      <p>Welcome to the about tab content!</p>
    </div>
  </section>

  <!-- To-Do List -->
  <section class="container">
    <h2>To-Do List</h2>
    <div class="todo-card">
      <div class="todo-header">
        <h1>To-do-List</h1>
        <div class="todo-input-group">
          <input type="text" id="todoInput" placeholder="Add your activity here..." />
          <button id="addBtn">Add</button>
        </div>
      </div>
      <ul id="todoList" class="todo-list">
        <li class="todo-item"><span>activity 1</span><span class="delete-btn">&times;</span></li>
        <li class="todo-item"><span>activity 2</span><span class="delete-btn">&times;</span></li>
        <li class="todo-item"><span>activity 3</span><span class="delete-btn">&times;</span></li>
        <li class="todo-item"><span>activity 4</span><span class="delete-btn">&times;</span></li>
      </ul>
    </div>
  </section>

  <!-- Image Slider -->
  <section class="container">
    <h2>Image Slider</h2>
    <div class="slider-container">
      <div class="slider-track">
        <img class="slide-img" src="https://picsum.photos/id/10/600/300" alt="Slide 1" />
        <img class="slide-img" src="https://picsum.photos/id/20/600/300" alt="Slide 2" />
        <img class="slide-img" src="https://picsum.photos/id/30/600/300" alt="Slide 3" />
        <img class="slide-img" src="https://picsum.photos/id/40/600/300" alt="Slide 4" />
        <img class="slide-img" src="https://picsum.photos/id/50/600/300" alt="Slide 5" />
      </div>
      <button class="prev-btn">&#10094;</button>
      <button class="next-btn">&#10095;</button>
      <div class="slider-dots">
        <span class="dot active" data-index="0"></span>
        <span class="dot" data-index="1"></span>
        <span class="dot" data-index="2"></span>
        <span class="dot" data-index="3"></span>
        <span class="dot" data-index="4"></span>
      </div>
    </div>
  </section>

  <!-- Toggle Switch -->
  <section class="container">
    <h2>Toggle Switch</h2>
    <div class="toggle-wrapper">
      <label class="switch">
        <input type="checkbox" id="emojiToggle" />
        <span class="slider-switch">
          <span class="emoji-icon">😊</span>
        </span>
      </label>
      <span id="toggleText" class="toggle-status">OFF</span>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
